# HTTP-01 引导示例；在私有侧替换域名和文档地址，再验证可选 PROXY protocol 链路。
server {
    listen 192.0.2.20:80 proxy_protocol;
    server_name accounts.example.com;
    set_real_ip_from 192.0.2.10;
    real_ip_header proxy_protocol;
    server_tokens off;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/gmail-manager-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 503; }
}
