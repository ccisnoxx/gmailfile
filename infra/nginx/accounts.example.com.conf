# 公开示例：可选 PROXY protocol 上游；文档地址不可直接用于部署。
# 在私有配置中替换域名/监听地址/可信来源/静态目录，并按实际 Nginx 版本验证。
# 两个区只在本项目 location 使用，不影响共享 Nginx 的其他站点。
limit_req_zone $binary_remote_addr zone=gm_login:1m rate=5r/m;
limit_req_zone $binary_remote_addr zone=gm_icon_fetch:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=gm_api:1m rate=10r/s;
log_format gmail_manager '$remote_addr [$time_local] "$request_method $uri" '
                         '$status $body_bytes_sent rt=$request_time rid=$request_id';

server {
    listen 192.0.2.20:80 proxy_protocol;
    server_name accounts.example.com;
    set_real_ip_from 192.0.2.10;
    real_ip_header proxy_protocol;
    server_tokens off;
    access_log /var/log/nginx/gmail-manager.access.log gmail_manager;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/gmail-manager-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://accounts.example.com$request_uri; }
}

server {
    listen 192.0.2.20:443 ssl proxy_protocol;
    http2 on;
    server_name accounts.example.com;
    ssl_certificate /etc/letsencrypt/gmail-manager/live/accounts.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/gmail-manager/live/accounts.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    set_real_ip_from 192.0.2.10;
    real_ip_header proxy_protocol;
    real_ip_recursive off;
    server_tokens off;
    client_max_body_size 10m;
    root /opt/example/gmail-manager/current/frontend/dist;
    index index.html;
    access_log /var/log/nginx/gmail-manager.access.log gmail_manager;
    error_log /var/log/nginx/gmail-manager.error.log warn;

    # 下层不定义 add_header，避免 location 覆盖父级安全头。
    # 管理工具的静态文件也 no-store，保持所有错误/限流响应语义一致。
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Cache-Control "no-store" always;

    location = /api/v1/auth/login {
        limit_req zone=gm_login burst=5 nodelay;
        limit_req zone=gm_api burst=30 nodelay;
        limit_req_status 429;
        include /etc/nginx/gmail-manager/proxy.conf;
    }
    location ~ ^/api/v1/auth/(reverify|password|totp/(setup|confirm|disable|regenerate-recovery-codes)|webauthn/(login|step-up|register)/(options|verify))$ {
        limit_req zone=gm_login burst=5 nodelay;
        limit_req zone=gm_api burst=30 nodelay;
        limit_req_status 429;
        include /etc/nginx/gmail-manager/proxy.conf;
    }
    location = /api/v1/apps/fetch-icon {
        limit_req zone=gm_icon_fetch burst=5 nodelay;
        limit_req zone=gm_api burst=30 nodelay;
        limit_req_status 429;
        include /etc/nginx/gmail-manager/proxy.conf;
    }
    location = /api/v1/health/ready { return 404; }
    location = /api/docs { return 404; }
    location = /api/redoc { return 404; }
    location = /api/openapi.json { return 404; }
    location /api/ {
        limit_req zone=gm_api burst=30 nodelay;
        limit_req_status 429;
        include /etc/nginx/gmail-manager/proxy.conf;
    }
    location /assets/ { try_files $uri =404; }
    location ~ /\. { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
